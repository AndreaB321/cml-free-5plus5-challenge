lab:
  title: CML Free 5+5 challenge - DHCP relay, DNS, TACACS+, port security
  description: DHCP relay, DNS, a TACACS+ login and port security, all checked from a host, within 5 network + 5 auxiliary nodes.
  notes: |
    # CML Free 5 + 5 challenge: DHCP relay, DNS, TACACS+ and port security, all checked from a host

    Built for CML 2.11 Free (5 network devices + 5 auxiliary nodes).

    | Bucket | Nodes | Count |
    |---|---|---|
    | Network | R1 (IOL-XE), SW1 (IOL-L2) | 2 of 5 |
    | Auxiliary | PC1, PC2 (Alpine), DNS-DHCP (dnsmasq), TACACS (tacplus) | 4 of 5 |
    | Not counted | SRV-SW (Unmanaged Switch) | - |

    On CML 2.10 Free (single limit of 5) this lab has 6 counted nodes, so it does not fit.

    ## Addressing

    | Segment | Subnet | Gateway |
    |---|---|---|
    | USERS, VLAN 10 | 10.10.10.0/24 | R1 Et0/0 10.10.10.1 (DHCP relay to 10.20.20.10) |
    | SERVERS | 10.20.20.0/24 | R1 Et0/1 10.20.20.1 |

    - SW1 SVI VLAN 10: 10.10.10.2
    - DNS-DHCP (dnsmasq): 10.20.20.10, scope 10.10.10.100-150, domain lab.local
    - TACACS (tac_plus): 10.20.20.20, key Cisco123!

    ## Credentials

    - PC1, PC2: cisco / cisco
    - R1 over SSH: tacadmin / admin123 (priv 15), tacoper / oper123 (priv 1), both on the TACACS+ server
    - R1 local fallback: localadmin / LocalOnly1 (works only when TACACS+ does not answer)
    - R1 console: no login, enable secret cisco

    Start all nodes. Wait about a minute after R1 boots: the EEM applet generates the RSA keys for SSH.

    ## Check 1: DHCP relay (from PC1)

    ```
    sudo udhcpc -i eth0 -x hostname:pc1
    ip addr show eth0
    ip route
    cat /etc/resolv.conf
    ```

    Expected: a lease from 10.10.10.100-150, default route via 10.10.10.1, nameserver 10.20.20.10, search lab.local.
    The DHCP server is on another subnet, so the lease proves the relay works.
    Optional, on R1: `debug ip dhcp server packet` shows the relayed packets.

    Repeat on PC2 with `-x hostname:pc2`.

    ## Check 2: DNS (from PC1)

    ```
    nslookup r1.lab.local
    nslookup 10.10.10.1
    nslookup www.lab.local
    nslookup -type=mx lab.local
    nslookup pc2.lab.local
    ```

    Expected: A record, PTR record, CNAME to r1.lab.local, MX to mail.lab.local.
    pc2.lab.local resolves because dnsmasq registers the names of its DHCP clients.

    ## Check 3: TACACS+ login (from PC1)

    ```
    ssh tacadmin@r1.lab.local     # prompt R1#  (priv 15 from TACACS+)
    ssh tacoper@r1.lab.local      # prompt R1>  (priv 1 from TACACS+)
    ssh localadmin@r1.lab.local   # rejected: the server answers, and it does not know this user
    ```

    Now stop the TACACS node in CML and try again:

    ```
    ssh localadmin@r1.lab.local   # accepted after a short timeout: fallback to the local database
    ssh tacadmin@r1.lab.local     # rejected: this user exists only on the server
    ```

    Start the TACACS node again. On R1, `show tacacs` shows the counters.
    On the TACACS console, `cat /var/log/tacplus-acct.log` shows the accounting records.

    ## Check 4: Layer 2 security, port security (from PC1 and PC2)

    Both host ports allow 1 MAC address (sticky), violation shutdown, automatic recovery after 30 seconds.

    On PC1, write down the current MAC, then spoof a new one:

    ```
    ip link show eth0
    sudo ip link set dev eth0 down
    sudo ip link set dev eth0 address 02:00:00:00:66:66
    sudo ip link set dev eth0 up
    ping -c 5 10.10.10.1          # fails
    ```

    On PC2: `ping -c 5 10.10.10.1` still works, so only the PC1 port was shut down.
    Optional, on SW1: `show port-security interface Ethernet0/1` and `show interfaces status err-disabled`.

    Restore the original MAC on PC1 and wait about 30 seconds for errdisable recovery:

    ```
    sudo ip link set dev eth0 down
    sudo ip link set dev eth0 address <original MAC>
    sudo ip link set dev eth0 up
    ping -c 5 10.10.10.1          # works again
    ```

    ## Why port security and not DHCP snooping

    The CML Free refplat has IOL-L2 as its only switch image. Cisco tests port security on IOL-L2,
    and the Cisco Community has reports of DHCP snooping on IOL-L2 that shows as operational but does not
    fill the binding table or block a rogue server. Port security gives a result you can trust from the host.

    ## Spare budget

    3 network slots and 1 auxiliary slot are still free. Ideas: add R2 and put the servers one routed hop
    away (OSPF plus relay across the core), or move SW1 management to TACACS+ as well.
  version: 0.3.0
