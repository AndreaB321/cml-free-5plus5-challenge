nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  x: 0
  y: 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  configuration:
  - name: ios_config.txt
    content: |
      hostname R1
      !
      no ip domain lookup
      ip domain name lab.local
      !
      enable secret cisco
      username localadmin privilege 15 secret LocalOnly1
      !
      aaa new-model
      !
      tacacs server TAC1
       address ipv4 10.20.20.20
       key Cisco123!
      !
      aaa group server tacacs+ TACGRP
       server name TAC1
       ip tacacs source-interface Ethernet0/1
      !
      ! Console never depends on TACACS+, so you cannot lock yourself out
      aaa authentication login CONSOLE none
      ! VTY: TACACS+ first, local database only if the server does not answer
      aaa authentication login VTY group TACGRP local
      aaa authorization exec VTY group TACGRP local
      aaa accounting exec VTY start-stop group TACGRP
      !
      ip ssh version 2
      !
      ! EEM applet generates the RSA keys for SSH at first boot
      event manager applet do-ssh authorization bypass
       event timer cron cron-entry "@reboot" maxrun 130
       action 01 wait 10
       action 02 cli command "enable"
       action 11 cli command "crypto key generate rsa modulus 2048"
       action 20 cli command "config t"
       action 21 cli command "no event manager applet do-ssh"
       action 22 cli command "end"
       action 23 cli command "write mem"
      !
      interface Ethernet0/0
       description USERS VLAN 10 (to SW1 Et0/0)
       ip address 10.10.10.1 255.255.255.0
       ip helper-address 10.20.20.10
       no shutdown
      !
      interface Ethernet0/1
       description SERVERS (to SRV-SW)
       ip address 10.20.20.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/2
       shutdown
      !
      interface Ethernet0/3
       shutdown
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
       login authentication CONSOLE
      line vty 0 4
       exec-timeout 15 0
       login authentication VTY
       authorization exec VTY
       accounting exec VTY
       transport input ssh telnet
      !
      end
- id: n1
  label: SW1
  node_definition: ioll2-xe
  x: -240
  y: 0
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  configuration:
  - name: ios_config.txt
    content: |
      hostname SW1
      !
      no ip domain lookup
      no ip routing
      vtp mode transparent
      !
      vlan 10
       name USERS
      !
      ! Recover err-disabled ports automatically after 30 seconds
      errdisable recovery cause psecure-violation
      errdisable recovery interval 30
      !
      interface Ethernet0/0
       description Uplink to R1 Et0/0
       switchport mode access
       switchport access vlan 10
       no shutdown
      !
      interface Ethernet0/1
       description PC1
       switchport mode access
       switchport access vlan 10
       switchport port-security maximum 1
       switchport port-security violation shutdown
       switchport port-security mac-address sticky
       switchport port-security
       spanning-tree portfast
       no shutdown
      !
      interface Ethernet0/2
       description PC2
       switchport mode access
       switchport access vlan 10
       switchport port-security maximum 1
       switchport port-security violation shutdown
       switchport port-security mac-address sticky
       switchport port-security
       spanning-tree portfast
       no shutdown
      !
      interface Ethernet0/3
       shutdown
      !
      interface Vlan10
       ip address 10.10.10.2 255.255.255.0
       no shutdown
      !
      ip default-gateway 10.10.10.1
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      !
      end
- id: n2
  label: PC1
  node_definition: alpine
  x: -400
  y: 160
  tags:
  - users
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  configuration:
  - name: node.cfg
    content: |
      # this is a shell script which will be sourced at boot
      hostname PC1
      # configurable user account
      USERNAME=cisco
      PASSWORD=cisco
      # no static address: the host must get one from DHCP via the R1 relay
      ip link set dev eth0 up
- id: n3
  label: PC2
  node_definition: alpine
  x: -240
  y: 160
  tags:
  - users
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  configuration:
  - name: node.cfg
    content: |
      # this is a shell script which will be sourced at boot
      hostname PC2
      # configurable user account
      USERNAME=cisco
      PASSWORD=cisco
      # no static address: the host must get one from DHCP via the R1 relay
      ip link set dev eth0 up
- id: n4
  label: SRV-SW
  node_definition: unmanaged_switch
  x: 240
  y: 0
  tags: []
  interfaces:
  - id: i0
    label: port0
    type: physical
    slot: 0
  - id: i1
    label: port1
    type: physical
    slot: 1
  - id: i2
    label: port2
    type: physical
    slot: 2
  - id: i3
    label: port3
    type: physical
    slot: 3
  - id: i4
    label: port4
    type: physical
    slot: 4
  - id: i5
    label: port5
    type: physical
    slot: 5
  - id: i6
    label: port6
    type: physical
    slot: 6
  - id: i7
    label: port7
    type: physical
    slot: 7
- id: n5
  label: DNS-DHCP
  node_definition: dnsmasq
  x: 400
  y: -80
  tags:
  - servers
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  - id: i1
    label: eth1
    type: physical
    slot: 1
  - id: i2
    label: eth2
    type: physical
    slot: 2
  - id: i3
    label: eth3
    type: physical
    slot: 3
  configuration:
  - name: dnsmasq.conf
    content: |
      # DHCP and DNS for lab.local (served through the DHCP relay on R1)
      no-resolv
      domain-needed
      local=/lab.local/
      domain=lab.local
      expand-hosts
      addn-hosts=/etc/banner_add_hosts
      #
      # Relayed scope: the netmask is required because the subnet is not local to this server
      dhcp-range=10.10.10.100,10.10.10.150,255.255.255.0,1h
      dhcp-option=option:router,10.10.10.1
      dhcp-option=option:dns-server,10.20.20.10
      dhcp-authoritative
      #
      # CNAME and MX records; A and PTR come from the hosts file (CCNA topic 4.4)
      cname=www.lab.local,r1.lab.local
      mx-host=lab.local,mail.lab.local,10
  - name: hosts
    content: |
      # A and PTR records (expand-hosts adds .lab.local)
      10.10.10.1   r1
      10.10.10.2   sw1
      10.20.20.10  dns mail
      10.20.20.20  tacacs
  - name: boot.sh
    content: |
      # insert more commands here
      ip address add 10.20.20.10/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 10.20.20.1
      #
      # keep the next line to indicate that the machine is ready
      echo "READY" >/dev/console
      exit 0
- id: n6
  label: TACACS
  node_definition: tacplus
  x: 400
  y: 80
  tags:
  - servers
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  - id: i1
    label: eth1
    type: physical
    slot: 1
  - id: i2
    label: eth2
    type: physical
    slot: 2
  - id: i3
    label: eth3
    type: physical
    slot: 3
  configuration:
  - name: tac_plus.conf
    content: |
      key = Cisco123!
      accounting file = /var/log/tacplus-acct.log
      acl = default {
        permit = 0.0.0.0
      }
      host = 0.0.0.0 {
        prompt = "TACACS+ auth: "
      }
      group = netadmin {
        default service = permit
        service = exec {
          priv-lvl = 15
        }
      }
      group = netoper {
        default service = permit
        service = exec {
          priv-lvl = 1
        }
      }
      user = tacadmin {
        login = cleartext admin123
        member = netadmin
      }
      user = tacoper {
        login = cleartext oper123
        member = netoper
      }
  - name: boot.sh
    content: |
      # insert more commands here
      ip address add 10.20.20.20/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 10.20.20.1
      #
      # keep the next line to indicate that the machine is ready
      echo "READY" >/dev/console
      exit 0
